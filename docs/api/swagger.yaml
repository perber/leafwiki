basePath: /api
definitions:
  dto.Backlink:
    properties:
      broken:
        type: boolean
      from_page_id:
        type: string
      from_path:
        type: string
      from_title:
        type: string
      to_page_id:
        type: string
    required:
    - broken
    - from_page_id
    - from_path
    - from_title
    - to_page_id
    type: object
  dto.BrokenLink:
    properties:
      from_page_id:
        type: string
      from_path:
        type: string
      from_title:
        type: string
      to_path:
        type: string
    required:
    - from_page_id
    - from_path
    - from_title
    - to_path
    type: object
  dto.BrokenLinks:
    properties:
      links:
        items:
          $ref: '#/definitions/dto.BrokenLink'
        type: array
    required:
    - links
    type: object
  dto.ErrorDetail:
    properties:
      args:
        description: Args are the values substituted into Template; omitted when empty.
        items:
          type: string
        type: array
      code:
        description: Code is the stable machine-readable error code, e.g. "page_not_found".
        type: string
      message:
        description: Message is the English human-readable message.
        type: string
      template:
        description: |-
          Template is the localization key the client translates; it doubles as
          the fallback message when no translation exists.
        type: string
    required:
    - code
    - message
    - template
    type: object
  dto.ErrorResponse:
    properties:
      error:
        allOf:
        - $ref: '#/definitions/dto.ErrorDetail'
        description: Error carries the localizable error details.
    required:
    - error
    type: object
  dto.IndexingStatus:
    properties:
      active:
        type: boolean
      failed:
        type: integer
      finished_at:
        type: string
      indexed:
        type: integer
    required:
    - active
    - failed
    - finished_at
    - indexed
    type: object
  dto.LegacyError:
    properties:
      error:
        description: Error is the human-readable error message.
        type: string
    required:
    - error
    type: object
  dto.LinkStatus:
    properties:
      backlinks:
        items:
          $ref: '#/definitions/dto.Backlink'
        type: array
      broken_incoming:
        items:
          $ref: '#/definitions/dto.Backlink'
        type: array
      broken_outgoings:
        items:
          $ref: '#/definitions/dto.OutgoingLink'
        type: array
      counts:
        $ref: '#/definitions/dto.LinkStatusCounts'
      outgoings:
        items:
          $ref: '#/definitions/dto.OutgoingLink'
        type: array
    required:
    - backlinks
    - broken_incoming
    - broken_outgoings
    - counts
    - outgoings
    type: object
  dto.LinkStatusCounts:
    properties:
      backlinks:
        type: integer
      broken_incoming:
        type: integer
      broken_outgoings:
        type: integer
      outgoings:
        type: integer
    required:
    - backlinks
    - broken_incoming
    - broken_outgoings
    - outgoings
    type: object
  dto.OutgoingLink:
    properties:
      broken:
        type: boolean
      from_page_id:
        type: string
      to_page_id:
        type: string
      to_page_title:
        type: string
      to_path:
        type: string
    required:
    - broken
    - from_page_id
    - to_page_id
    - to_page_title
    - to_path
    type: object
  dto.PropertyEntry:
    properties:
      type:
        description: currently always "text"
        type: string
      value:
        type: string
    required:
    - type
    - value
    type: object
  dto.PropertyKeyCount:
    properties:
      count:
        type: integer
      key:
        type: string
    required:
    - count
    - key
    type: object
  dto.PropertyPage:
    properties:
      createdAt:
        type: string
      creatorId:
        type: string
      id:
        type: string
      lastAuthor:
        $ref: '#/definitions/dto.UserLabel'
      lastAuthorId:
        type: string
      path:
        type: string
      properties:
        additionalProperties:
          $ref: '#/definitions/dto.PropertyEntry'
        type: object
      title:
        type: string
      updatedAt:
        type: string
    required:
    - id
    - path
    - properties
    - title
    type: object
  dto.SearchResult:
    properties:
      count:
        type: integer
      items:
        items:
          $ref: '#/definitions/dto.SearchResultItem'
        type: array
      limit:
        type: integer
      offset:
        type: integer
      tag_facets:
        items:
          $ref: '#/definitions/dto.SearchTagFacet'
        type: array
    required:
    - count
    - items
    - limit
    - offset
    - tag_facets
    type: object
  dto.SearchResultItem:
    properties:
      excerpt:
        type: string
      kind:
        type: string
      page_id:
        type: string
      path:
        type: string
      rank:
        type: number
      tags:
        items:
          type: string
        type: array
      title:
        type: string
    required:
    - excerpt
    - kind
    - page_id
    - path
    - rank
    - title
    type: object
  dto.SearchTagFacet:
    properties:
      count:
        type: integer
      tag:
        type: string
    required:
    - count
    - tag
    type: object
  dto.TagCount:
    properties:
      count:
        type: integer
      tag:
        type: string
    required:
    - count
    - tag
    type: object
  dto.TaggedPage:
    properties:
      createdAt:
        type: string
      creatorId:
        type: string
      excerpt:
        type: string
      id:
        type: string
      lastAuthor:
        $ref: '#/definitions/dto.UserLabel'
      lastAuthorId:
        type: string
      path:
        type: string
      tags:
        items:
          type: string
        type: array
      title:
        type: string
      updatedAt:
        type: string
    required:
    - id
    - path
    - tags
    - title
    type: object
  dto.UserLabel:
    properties:
      id:
        type: string
      username:
        type: string
    required:
    - id
    - username
    type: object
  health.HealthResponse:
    properties:
      checks:
        additionalProperties:
          type: string
        description: |-
          Checks maps each check name (sqlite, data_dir, search) to its result:
          "ok" or "failed" for sqlite and data_dir; "ok", "indexing" or "failed" for search.
        type: object
      status:
        description: Status is "ok" when every check passes, otherwise "degraded".
        type: string
    required:
    - checks
    - status
    type: object
info:
  contact: {}
  description: |-
    Development API of LeafWiki. This documentation is incomplete, experimental and may change before v1; only a few operations are described so far.
    API keys (Bearer authentication) are available only when LeafWiki runs with `--enable-api-key-management` and authentication enabled. Existing browser API routes are not newly hidden behind that flag.
    Browser sessions use the access and refresh cookies (`__Host-leafwiki_at` and `__Host-leafwiki_rt` on secure connections, unprefixed names for allowed insecure development). Session writes are protected by CSRF double-submit: send the `X-CSRF-Token` header matching the CSRF cookie (the `csrf_token` form field is accepted as a fallback).
    The documented base path is the default mount. A deployment started with `--base-path=/wiki` prepends `/wiki` to every documented URL.
  license:
    name: MIT
    url: https://github.com/perber/leafwiki/blob/main/LICENSE
  title: LeafWiki API
  version: 0.x
paths:
  /health:
    get:
      description: 'Public liveness and readiness probe; no authentication is required
        and session cookies are never validated. Global middleware can still reject
        a request before the handler runs: 401 for an invalid, revoked or expired
        API key (only when API-key management is enabled) or for an identity asserted
        by a trusted reverse proxy that LeafWiki rejects (only when reverse-proxy
        authentication is enabled), and 429 when API-key attempts are throttled.'
      produces:
      - application/json
      responses:
        "200":
          description: All checks passed (ongoing search indexing still counts as
            healthy)
          schema:
            $ref: '#/definitions/health.HealthResponse'
        "401":
          description: 'Invalid, revoked or expired API key (when API-key management
            is enabled), or a rejected trusted-proxy identity: unknown user or auto-provisioning
            email conflict (when reverse-proxy authentication is enabled)'
          schema:
            $ref: '#/definitions/dto.LegacyError'
        "429":
          description: API-key attempts throttled
          schema:
            $ref: '#/definitions/dto.LegacyError'
        "503":
          description: 'Degraded: the body is a HealthResponse with failed checks.
            If API-key resolution cannot reach its store, the body is a LegacyError
            instead. Swagger 2.0 cannot express this alternative, so the schema is
            a broad object.'
          schema:
            type: object
      summary: Check instance health
      tags:
      - health
  /links/broken:
    get:
      description: |-
        Lists every link in the wiki whose target page does not exist, with the page it appears on.
        Access: admin only, also when public access is on. API keys act with the lesser of the owner's role and the key's role. With authentication disabled the route answers 403.
      produces:
      - application/json
      responses:
        "200":
          description: Broken links; an empty list when there are none
          schema:
            $ref: '#/definitions/dto.BrokenLinks'
        "401":
          description: No valid session, an invalid, revoked or expired API key (when
            API-key management is enabled), or a rejected trusted-proxy identity (when
            reverse-proxy authentication is enabled)
          schema:
            $ref: '#/definitions/dto.LegacyError'
        "403":
          description: The caller is not an admin, or authentication is disabled
          schema:
            $ref: '#/definitions/dto.LegacyError'
        "429":
          description: API-key attempts throttled
          schema:
            $ref: '#/definitions/dto.LegacyError'
        "500":
          description: 'Link lookup failed: the body is an ErrorResponse (code link_internal_error).
            Authentication middleware failures return a LegacyError instead. Swagger
            2.0 cannot express this alternative, so the schema is a broad object.'
          schema:
            type: object
        "503":
          description: API-key store unavailable during a live restore (when API-key
            management is enabled)
          schema:
            $ref: '#/definitions/dto.LegacyError'
      security:
      - BearerAuth: []
      summary: List broken links
      tags:
      - links
  /pages/{id}/links:
    get:
      description: |-
        Lists the links pointing at the given page (backlinks) and, separately, the links from other pages to this page's path that are broken (broken incoming links). The links starting on the page are split the same way into outgoing and broken outgoing links. The counters hold the length of each of the four lists.
        Access: a signed-in user (session cookie, API key or reverse-proxy identity); anonymous callers only when public access is on. With public access on, a missing or invalid session cookie is treated as anonymous instead of 401.
      parameters:
      - description: Page ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Link status of the page; empty lists for a page without links
          schema:
            $ref: '#/definitions/dto.LinkStatus'
        "401":
          description: No valid session while public access is off, an invalid, revoked
            or expired API key (when API-key management is enabled), or a rejected
            trusted-proxy identity (when reverse-proxy authentication is enabled)
          schema:
            $ref: '#/definitions/dto.LegacyError'
        "404":
          description: No page with this ID (code link_page_not_found)
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "429":
          description: API-key attempts throttled
          schema:
            $ref: '#/definitions/dto.LegacyError'
        "500":
          description: 'Link lookup failed: the body is an ErrorResponse (code link_internal_error).
            Authentication middleware failures return a LegacyError instead. Swagger
            2.0 cannot express this alternative, so the schema is a broad object.'
          schema:
            type: object
        "503":
          description: API-key store unavailable during a live restore (when API-key
            management is enabled)
          schema:
            $ref: '#/definitions/dto.LegacyError'
      security:
      - BearerAuth: []
      summary: Get link status of a page
      tags:
      - links
  /properties:
    get:
      description: |-
        Lists the frontmatter property keys with the number of pages carrying each, ordered by count (descending), then by key. Nested properties use dot-joined keys such as `a.b`.
        Access: a signed-in user (session cookie, API key or reverse-proxy identity); anonymous callers only when public access is on. With public access on, a missing or invalid session cookie is treated as anonymous instead of 401.
      parameters:
      - description: Prefix filter on the key; trimmed and lowercased before matching
        in: query
        name: q
        type: string
      - default: 50
        description: Maximum number of keys; values below 1 mean 50, values above
          200 mean 200
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Keys with page counts; empty array when nothing matches
          schema:
            items:
              $ref: '#/definitions/dto.PropertyKeyCount'
            type: array
        "400":
          description: limit is not an integer (code properties_invalid_limit)
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: No valid session while public access is off, an invalid, revoked
            or expired API key (when API-key management is enabled), or a rejected
            trusted-proxy identity (when reverse-proxy authentication is enabled)
          schema:
            $ref: '#/definitions/dto.LegacyError'
        "429":
          description: API-key attempts throttled
          schema:
            $ref: '#/definitions/dto.LegacyError'
        "500":
          description: 'Index lookup failed: the body is an ErrorResponse (code properties_internal_error).
            Authentication middleware failures return a LegacyError instead. Swagger
            2.0 cannot express this alternative, so the schema is a broad object.'
          schema:
            type: object
        "503":
          description: API-key store unavailable during a live restore (when API-key
            management is enabled)
          schema:
            $ref: '#/definitions/dto.LegacyError'
      security:
      - BearerAuth: []
      summary: List property keys
      tags:
      - properties
  /properties/pages:
    get:
      description: |-
        Lists the pages whose property `key` has exactly the value `value`. Key and value are matched as given (not trimmed or lowercased); each must contain a non-space character.
        Access: a signed-in user (session cookie, API key or reverse-proxy identity); anonymous callers only when public access is on. With public access on, a missing or invalid session cookie is treated as anonymous instead of 401.
      parameters:
      - description: Property key, for example `status` or a dot-joined nested key
        in: query
        name: key
        required: true
        type: string
      - description: Exact property value
        in: query
        name: value
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Matching pages with all their properties; empty array when
            none match
          schema:
            items:
              $ref: '#/definitions/dto.PropertyPage'
            type: array
        "400":
          description: key or value is missing or blank (code properties_missing_key
            or properties_missing_value)
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: No valid session while public access is off, an invalid, revoked
            or expired API key (when API-key management is enabled), or a rejected
            trusted-proxy identity (when reverse-proxy authentication is enabled)
          schema:
            $ref: '#/definitions/dto.LegacyError'
        "429":
          description: API-key attempts throttled
          schema:
            $ref: '#/definitions/dto.LegacyError'
        "500":
          description: 'Index lookup failed: the body is an ErrorResponse (code properties_internal_error).
            Authentication middleware failures return a LegacyError instead. Swagger
            2.0 cannot express this alternative, so the schema is a broad object.'
          schema:
            type: object
        "503":
          description: API-key store unavailable during a live restore (when API-key
            management is enabled)
          schema:
            $ref: '#/definitions/dto.LegacyError'
      security:
      - BearerAuth: []
      summary: List pages by property
      tags:
      - properties
  /search:
    get:
      description: |-
        Full-text search over page titles and content, or a tag-only listing when `tags` is given without `q`. With both, the text hits are filtered to pages carrying every given tag. Each hit carries a rank and an excerpt; the result also lists the tags of the matching pages as facets. `limit` and `offset` are handed to the text index as they are (no upper bound, `-1` means all rows); a tag-only search turns a `limit` below 1 into 20 and clamps a negative `offset`.
        Access: a signed-in user (session cookie, API key or reverse-proxy identity); anonymous callers only when public access is on. With public access on, a missing or invalid session cookie is treated as anonymous instead of 401.
      parameters:
      - description: Search text; required unless `tags` is given
        in: query
        name: q
        type: string
      - collectionFormat: multi
        description: Tags a page must all carry; repeat the parameter or separate
          tags with commas
        in: query
        items:
          type: string
        name: tags
        type: array
      - default: 0
        description: Number of hits to skip
        in: query
        name: offset
        type: integer
      - default: 20
        description: Maximum number of hits
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Hits and tag facets; empty lists when nothing matches
          schema:
            $ref: '#/definitions/dto.SearchResult'
        "400":
          description: Neither `q` nor a tag given (code search_missing_query), or
            `offset` or `limit` is not an integer (codes search_invalid_offset, search_invalid_limit)
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: No valid session while public access is off, an invalid, revoked
            or expired API key (when API-key management is enabled), or a rejected
            trusted-proxy identity (when reverse-proxy authentication is enabled)
          schema:
            $ref: '#/definitions/dto.LegacyError'
        "429":
          description: API-key attempts throttled
          schema:
            $ref: '#/definitions/dto.LegacyError'
        "500":
          description: 'Index lookup failed: the body is an ErrorResponse (code search_internal_error).
            Authentication middleware failures return a LegacyError instead. Swagger
            2.0 cannot express this alternative, so the schema is a broad object.'
          schema:
            type: object
        "503":
          description: API-key store unavailable during a live restore (when API-key
            management is enabled)
          schema:
            $ref: '#/definitions/dto.LegacyError'
      security:
      - BearerAuth: []
      summary: Search pages
      tags:
      - search
  /search/status:
    get:
      description: |-
        Reports whether the search index is being (re)built, how many pages were indexed and how many failed in the current or last run, and when the last run finished. `finished_at` is `0001-01-01T00:00:00Z` until the first run has finished.
        Access: a signed-in user (session cookie, API key or reverse-proxy identity); anonymous callers only when public access is on. With public access on, a missing or invalid session cookie is treated as anonymous instead of 401.
      produces:
      - application/json
      responses:
        "200":
          description: Current indexing status
          schema:
            $ref: '#/definitions/dto.IndexingStatus'
        "401":
          description: No valid session while public access is off, an invalid, revoked
            or expired API key (when API-key management is enabled), or a rejected
            trusted-proxy identity (when reverse-proxy authentication is enabled)
          schema:
            $ref: '#/definitions/dto.LegacyError'
        "429":
          description: API-key attempts throttled
          schema:
            $ref: '#/definitions/dto.LegacyError'
        "500":
          description: Authentication middleware failure; the handler itself cannot
            fail
          schema:
            $ref: '#/definitions/dto.LegacyError'
        "503":
          description: API-key store unavailable during a live restore (when API-key
            management is enabled)
          schema:
            $ref: '#/definitions/dto.LegacyError'
      security:
      - BearerAuth: []
      summary: Get search indexing status
      tags:
      - search
  /tags:
    get:
      description: |-
        Lists tags with the number of pages carrying each, ordered by count (descending), then by tag. With `selected`, only pages carrying every selected tag are counted and the selected tags themselves are left out, so the result is the tags that can narrow the selection further.
        Access: a signed-in user (session cookie, API key or reverse-proxy identity); anonymous callers only when public access is on. With public access on, a missing or invalid session cookie is treated as anonymous instead of 401.
      parameters:
      - description: Prefix filter on the tag name; trimmed and lowercased before
          matching
        in: query
        name: q
        type: string
      - default: 50
        description: Maximum number of tags; values below 1 mean 50, values above
          200 mean 200
        in: query
        name: limit
        type: integer
      - collectionFormat: multi
        description: Already selected tags; repeat the parameter or separate tags
          with commas
        in: query
        items:
          type: string
        name: selected
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: Tags with page counts; empty array when nothing matches
          schema:
            items:
              $ref: '#/definitions/dto.TagCount'
            type: array
        "400":
          description: limit is not an integer (code tags_invalid_limit)
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: No valid session while public access is off, an invalid, revoked
            or expired API key (when API-key management is enabled), or a rejected
            trusted-proxy identity (when reverse-proxy authentication is enabled)
          schema:
            $ref: '#/definitions/dto.LegacyError'
        "429":
          description: API-key attempts throttled
          schema:
            $ref: '#/definitions/dto.LegacyError'
        "500":
          description: 'Index lookup failed: the body is an ErrorResponse (code tags_internal_error).
            Authentication middleware failures return a LegacyError instead. Swagger
            2.0 cannot express this alternative, so the schema is a broad object.'
          schema:
            type: object
        "503":
          description: API-key store unavailable during a live restore (when API-key
            management is enabled)
          schema:
            $ref: '#/definitions/dto.LegacyError'
      security:
      - BearerAuth: []
      summary: List tags
      tags:
      - tags
  /tags/pages:
    get:
      description: |-
        Lists the pages that carry every given tag. Tags are trimmed and lowercased before matching.
        Access: a signed-in user (session cookie, API key or reverse-proxy identity); anonymous callers only when public access is on. With public access on, a missing or invalid session cookie is treated as anonymous instead of 401.
      parameters:
      - collectionFormat: multi
        description: Tags a page must all carry; repeat the parameter or separate
          tags with commas
        in: query
        items:
          type: string
        name: tags
        required: true
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: Matching pages; empty array when none match
          schema:
            items:
              $ref: '#/definitions/dto.TaggedPage'
            type: array
        "400":
          description: No non-empty tag given (code tags_missing_param)
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: No valid session while public access is off, an invalid, revoked
            or expired API key (when API-key management is enabled), or a rejected
            trusted-proxy identity (when reverse-proxy authentication is enabled)
          schema:
            $ref: '#/definitions/dto.LegacyError'
        "429":
          description: API-key attempts throttled
          schema:
            $ref: '#/definitions/dto.LegacyError'
        "500":
          description: 'Index lookup failed: the body is an ErrorResponse (code tags_internal_error).
            Authentication middleware failures return a LegacyError instead. Swagger
            2.0 cannot express this alternative, so the schema is a broad object.'
          schema:
            type: object
        "503":
          description: API-key store unavailable during a live restore (when API-key
            management is enabled)
          schema:
            $ref: '#/definitions/dto.LegacyError'
      security:
      - BearerAuth: []
      summary: List pages by tags
      tags:
      - tags
securityDefinitions:
  BearerAuth:
    description: API key sent as the entire header value `Bearer lw_<prefix>_<secret>`,
      not just the secret. A request authenticated by a resolved key acts with the
      effective role of the lesser of the key owner's role and the key's role. A resolved
      key skips CSRF checks; a header merely being present does not. Routes that reject
      API-key authentication are browser-session only and say so. Cookies remain an
      alternative authentication path and are described in prose because Swagger 2.0
      cannot express them.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
