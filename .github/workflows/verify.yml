name: Verify

on:
  pull_request:
    branches:
      - main
      - release/*
      - releases/*
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Small repository checks; `make verify` runs the same locally.
  verify:
    name: Repository checks (make verify)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Run make verify
        run: make verify
