name: Frontend CI

on:
  pull_request:
    branches:
      - main
      - release/*
      - releases/*

permissions:
  contents: read

jobs:
  lint-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install, lint with ESLint and check formatting (make ui-lint)
        run: make ui-lint

      - name: Scan dependencies with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: fs
          scan-ref: 'ui/leafwiki-ui'
          trivyignores: '.trivyignore'
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

  test-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install, run unit tests and build (make ui-test)
        run: make ui-test
          
