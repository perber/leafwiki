name: Build a test image from a PR code

on:
  issue_comment:
    types: [created]

jobs:
  build:
    if: >-
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/create-test-image') &&
      contains(fromJSON('["OWNER", "COLLABORATOR"]'), github.event.comment.author_association)

    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write # only for the reaction

    outputs:
      version: ${{ steps.vars.outputs.version }}
      owner: ${{ steps.vars.outputs.owner }}

    steps:
      - name: React to triggering comment
        continue-on-error: true # cosmetic 👍 only; known GITHUB_TOKEN reactions-API flakiness must not block the actual build
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: '+1',
            });

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Get Pull Request Information
        id: pr
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            core.setOutput('sha', pr.data.head.sha);

      - name: Checkout PR commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.pr.outputs.sha }}

      - name: Set version/owner
        id: vars
        run: |
          SHA=$(echo "${{ steps.pr.outputs.sha }}" | cut -c1-7)
          echo "version=pr-${{ github.event.issue.number }}-$SHA" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      # No docker/login-action, no packages: write, no GHCR_GITHUB_TOKEN
      # anywhere above or below this line — this job builds the PR's own
      # (possibly forked, untrusted) code and must never hold registry
      # credentials while doing so. See pleaf issue
      # build-image-pr-pwn-request-pattern.md.
      - name: Build image (no push)
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file Dockerfile \
            --target final \
            --build-arg APP_VERSION=${{ steps.vars.outputs.version }} \
            --annotation "index:org.opencontainers.image.title=LeafWiki" \
            --annotation "index:org.opencontainers.image.description=LeafWiki – A fast wiki for people who think in folders, not feeds" \
            --sbom=true \
            --provenance=mode=max \
            --output type=oci,dest=image.tar \
            .

      - name: Upload image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-image
          path: image.tar
          retention-days: 1

  push:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: quay.io/skopeo/stable@sha256:064d2cefb512c97d5a22979599ca05b7198fd6176494a634e1f31bd6b5fbd77a
      options: --user 0

    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Download image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pr-image

      # This job never checks out the repo and never runs any code from the
      # PR — it only copies the already-built artifact from the `build` job
      # into the registry, so it's the only job that needs GHCR_GITHUB_TOKEN.
      - name: Push image to GHCR
        id: push
        run: |
          IMAGE=ghcr.io/${{ needs.build.outputs.owner }}/leafwiki:${{ needs.build.outputs.version }}
          skopeo copy \
            --dest-creds "${{ github.actor }}:${{ secrets.GHCR_GITHUB_TOKEN }}" \
            oci-archive:image.tar \
            docker://$IMAGE
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Comment image reference on PR
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🐳 Test image built: \`${{ steps.push.outputs.image }}\`\n\n\`\`\`\ndocker pull ${{ steps.push.outputs.image }}\n\`\`\``,
            });
