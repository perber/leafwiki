name: Backend CI

on:
  pull_request:
    branches:
      - main
      - release/*
      - releases/*

permissions:
  contents: read

jobs:
  lint-go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install dependencies
        run: go mod download

      - name: Lint with golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version-file: .golangci-lint-version
          args: --timeout=5m
    
  # linux/386 is a release target. Building alone isn't enough: 32-bit-only
  # runtime bugs (e.g. unaligned 64-bit atomics) compile fine and only panic
  # at runtime. 386 binaries run natively on the amd64 runner.
  test-go-386:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install dependencies
        run: go mod download

      - name: Run tests on linux/386
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: '386'
        run: make test

  # Windows is a release target; build-go-cross only compiles for it, which
  # can't catch filesystem differences (#1698).
  test-go-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install dependencies
        run: go mod download

      - name: Run tests on windows/amd64
        run: go test ./...

  # windows/amd64 and darwin/arm64 are release targets, but the release
  # workflow is the only other place that builds them; without this a
  # platform-specific compile error would first show up at the release tag.
  # `make cross` builds and vets only: the runner can't execute these binaries.
  build-go-cross:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [windows/amd64, darwin/arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install dependencies
        run: go mod download

      - name: Build and vet for ${{ matrix.platform }}
        env:
          CROSS_PLATFORM: ${{ matrix.platform }}
        run: make cross CROSS_PLATFORMS="$CROSS_PLATFORM"

  # The experimental API specification is generated and committed. Regenerate
  # on the host platform and fail if the committed files are stale. The
  # generator runs only here, never inside the go test jobs.
  api-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Generate API documentation
        run: make api-docs

      - name: Verify committed API documentation is up to date
        run: git diff --exit-code -- docs/api

      - name: Upload API documentation as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-docs
          path: |
            docs/api/swagger.json
            docs/api/swagger.yaml
          if-no-files-found: error

  test-install-scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Test checksum verification in install.sh / update.sh
        run: ./scripts/verify-checksum.test.sh

  test-go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install dependencies
        run: go mod download

      - name: Run tests with coverage
        run: |
          mkdir -p coverage
          go test -v -coverprofile=coverage/coverage.out ./...
          go tool cover -func=coverage/coverage.out

      - name: Upload coverage report as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage/coverage.out
      
      - name: Run govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          # The exact version setup-go resolved from go.mod's toolchain line.
          # Not go-version-file: setup-go exported GOTOOLCHAIN=local above,
          # and with that set it reads go.mod's `go` line (the minimum)
          # instead of the toolchain.
          go-version-input: ${{ steps.setup-go.outputs.go-version }}
          go-package: './...'

      - name: Scan dependencies with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: fs
          scan-ref: '.'
          trivyignores: '.trivyignore'
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
