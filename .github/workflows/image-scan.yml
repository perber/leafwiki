name: Image Scan

# The dependency scans in backend.yml and frontend.yml check go.sum and
# package-lock.json; this one checks the final Docker image, including the
# alpine base packages they can't see. PRs that change an image input build
# and scan it; the weekly run scans the published image, because new CVEs
# show up in an image that hasn't changed.

on:
  pull_request:
    branches:
      - main
      - release/*
      - releases/*
    paths:
      - Dockerfile
      - docker-entrypoint.sh
      - go.mod
      - go.sum
      - ui/leafwiki-ui/package.json
      - ui/leafwiki-ui/package-lock.json
      - .trivyignore
      - Makefile
      - .github/workflows/image-scan.yml
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan-pr:
    name: Scan the image built from the PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.0

      - name: Build and scan the image
        run: make scan-image

  scan-published:
    name: Scan the published image (${{ matrix.platform }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload the SARIF report to code scanning
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    env:
      PLATFORM: ${{ matrix.platform }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.0

      - name: Scan the published image (SARIF)
        id: sarif
        run: |
          make scan-published-image SCAN_PLATFORM="$PLATFORM" TRIVY_EXIT_CODE=0 \
            TRIVY_EXTRA_FLAGS="--format sarif --output trivy-results.sarif"
          echo "category=image-${PLATFORM#linux/}" >> "$GITHUB_OUTPUT"

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy-results.sarif
          category: ${{ steps.sarif.outputs.category }}

      # A red scheduled run sends the failure email; the SARIF upload above
      # alone would only show up in the Security tab. Reuses the vulnerability
      # DB downloaded by the SARIF step.
      - name: Fail on fixable HIGH/CRITICAL findings
        run: make scan-published-image SCAN_PLATFORM="$PLATFORM" TRIVY_EXTRA_FLAGS=--skip-db-update
