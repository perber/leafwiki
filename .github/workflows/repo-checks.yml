name: Repository Checks

on:
  pull_request:
    branches:
      - main
      - release/*
      - releases/*
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  private-references:
    name: Check for private references
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Check tracked files for private notes and home paths
        run: ./scripts/check-private-references.sh
